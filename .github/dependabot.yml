
version: 2
updates:
  - package-ecosystem: 'npm' # See documentation for possible values
    directory: '/' # Location of package manifests
    schedule:
      interval: 'weekly'
      day: 'monday' # Choose a specific day of the week (e.g., 'monday')
      time: '10:00'
    open-pull-requests-limit: 20
    ignore:
      # TypeScript 7 (native port) drops the JS compiler API that vue-tsc needs.
      # Re-enable once vue-tsc supports it.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
